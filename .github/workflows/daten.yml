name: Daten aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"    # täglich 05:00 UTC, also 6 oder 7 Uhr in Berlin
    - cron: "30 21 * * 0,6" # zusätzlich Sa/So abends, damit Ergebnisse vom Spieltag schnell da sind
  workflow_dispatch:        # zusätzlich per Knopf in GitHub startbar

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bildwerkzeug für die Teamlogos
        run: command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null)
      - name: Daten von saisonmanager.de holen
        env:
          SAISONMANAGER_API_KEY: ${{ secrets.SAISONMANAGER_API_KEY }}
        run: |
          if [ -z "$SAISONMANAGER_API_KEY" ]; then
            echo "::warning::Kein Secret SAISONMANAGER_API_KEY gesetzt. Antrag unter https://saisonmanager.de/api-zugang, dann unter Settings → Secrets and variables → Actions eintragen."
            exit 0
          fi
          bash abruf.sh
      - name: Änderungen speichern
        run: |
          git config user.name "daten-bot"
          git config user.email "daten-bot@users.noreply.github.com"
          git add daten app/index.html
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
          git push
