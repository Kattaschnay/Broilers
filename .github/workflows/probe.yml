name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p site
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o site/index.html https://berlinbroilers.de/ || true
          curl -sSL -A "$UA" -o site/logo.jpg https://berlinbroilers.de/wp-content/uploads/2025/05/BB04-Logo-neu.jpg || true
          curl -sSL -A "$UA" -o site/icon.jpg https://berlinbroilers.de/wp-content/uploads/2025/05/cropped-BB04-Logo-neu-270x270.jpg || true
          i=0
          for u in $(grep -oE 'href="https://berlinbroilers\.de/[^"]+\.css[^"]*"' site/index.html | sed 's/href="//;s/"$//' | head -15); do
            i=$((i+1)); curl -sSL -A "$UA" -o site/style$i.css "$u"; echo "$i $u" >> site/css.txt
          done
          grep -oE '<style[^>]*>[^<]*</style>' site/index.html > site/inline.css || true
          for p in training kontakt; do curl -sSL -A "$UA" -o site/$p.html https://berlinbroilers.de/$p/ || true; done
          ls -la site > site/ls.txt
      - name: commit
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add site; git commit -m "probe site"; git push
